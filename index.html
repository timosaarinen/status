<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STATUS — Not Even Fucking Close</title>
  </head>
  <body>
    <main id="shell">
      <section id="stage" aria-label="STATUS C64 cracktro">
        <canvas id="shader" width="160" height="100"></canvas>
        <canvas id="screen" width="320" height="200"></canvas>
      </section>
      <section id="controls" aria-label="Playback controls">
        <button id="play" type="button">LOAD &amp; RUN</button>
        <div id="transport">
          <input
            id="timeline"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0"
            disabled
            aria-label="Demo timeline"
          />
          <div id="transport-readout">
            <span id="timecode">0:00.00 / --:--.--</span>
            <span id="status">LOADING TIMELINE...</span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
